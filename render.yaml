services:
  - type: web
    name: freshfood
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freshfood-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: freshfood-db
    plan: free
    databaseName: freshfood
    user: freshfood
